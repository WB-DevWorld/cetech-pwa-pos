<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CETECH POS baseline register</title>
  <style>/* Semantic POS tokens — translated from the approved frontend reference.
   Values are the reference palette; names are the production design system. */

:root {
  --color-bg: #f5f7fa;
  --color-surface: #ffffff;
  --color-surface-2: #eef2f7;
  --color-surface-3: #e4eaf2;
  --color-text: #172033;
  --color-text-muted: #5d6b80;
  --color-border: #d7dee8;
  --color-primary: #174ea6;
  --color-primary-hover: #123e84;
  --color-primary-soft: #e9f0fc;
  --color-success: #177245;
  --color-success-soft: #e7f6ee;
  --color-warning: #9a5b00;
  --color-warning-soft: #fff3d6;
  --color-danger: #b42318;
  --color-danger-soft: #fdecea;
  --color-info: #2459a8;
  --color-info-soft: #e9f0fc;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.08);
  --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.12);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --touch: 44px;
  --sidebar: 88px;
  --font-xs: 12px;
  --font-sm: 14px;
  --font-md: 16px;
  --font-lg: 20px;
  --font-xl: 26px;
  --font-2xl: 34px;
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

html[data-theme="dark"] {
  --color-bg: #0f141d;
  --color-surface: #171e29;
  --color-surface-2: #202938;
  --color-surface-3: #2a3547;
  --color-text: #f3f6fa;
  --color-text-muted: #aab5c5;
  --color-border: #344257;
  --color-primary: #79a8ff;
  --color-primary-hover: #9bc0ff;
  --color-primary-soft: #20385f;
  --color-success: #75d7a4;
  --color-success-soft: #173c2a;
  --color-warning: #ffc45d;
  --color-warning-soft: #493817;
  --color-danger: #ff9b94;
  --color-danger-soft: #4f2525;
  --color-info: #9bc0ff;
  --color-info-soft: #20385f;
  --shadow-sm: none;
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

html[data-theme="light"] {
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --color-bg: #0f141d;
    --color-surface: #171e29;
    --color-surface-2: #202938;
    --color-surface-3: #2a3547;
    --color-text: #f3f6fa;
    --color-text-muted: #aab5c5;
    --color-border: #344257;
    --color-primary: #79a8ff;
    --color-primary-hover: #9bc0ff;
    --color-primary-soft: #20385f;
    --color-success: #75d7a4;
    --color-success-soft: #173c2a;
    --color-warning: #ffc45d;
    --color-warning-soft: #493817;
    --color-danger: #ff9b94;
    --color-danger-soft: #4f2525;
    --color-info: #9bc0ff;
    --color-info-soft: #20385f;
    --shadow-sm: none;
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--color-bg);
  color: var(--color-text);
}

body {
  min-height: 100vh;
  font-size: var(--font-md);
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  min-height: var(--touch);
}

button,
[role="button"] {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--color-primary) 55%, transparent);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.skip-link {
  position: fixed;
  left: 12px;
  top: -60px;
  z-index: 1000;
  background: var(--color-text);
  color: var(--color-surface);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
}

.skip-link:focus {
  top: 12px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.btn {
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text);
  border-radius: 10px;
  padding: 9px 14px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  text-decoration: none;
  min-height: var(--touch);
}

.btn:hover:not(:disabled) {
  background: var(--color-surface-2);
}

.btn.primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}

.btn.primary:hover:not(:disabled) {
  background: var(--color-primary-hover);
}

.btn.block {
  width: 100%;
}

.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--color-text-muted);
  font-weight: 700;
}

.btn.ghost:hover:not(:disabled) {
  background: var(--color-surface-2);
  color: var(--color-text);
}

.pay-btn {
  min-height: 54px;
  font-size: 18px;
}

.icon-btn {
  width: var(--touch);
  height: var(--touch);
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.card-pad {
  padding: var(--space-4);
}

.muted {
  color: var(--color-text-muted);
  font-size: var(--font-sm);
}

.subtle {
  color: var(--color-text-muted);
}

.eyebrow {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}

.field {
  display: grid;
  gap: 6px;
}

.field label,
.field .label {
  font-size: 13px;
  font-weight: 700;
}

.input,
.select {
  width: 100%;
  min-height: var(--touch);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  border-radius: 10px;
  padding: 9px 11px;
}

.stack {
  display: grid;
  gap: var(--space-3);
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--space-4);
  margin-bottom: 18px;
}

.page-head h1 {
  margin: 0 0 4px;
  font-size: var(--font-xl);
}

.page-head p {
  margin: 0;
  color: var(--color-text-muted);
}

.banner {
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  gap: 9px;
  align-items: flex-start;
  border: 1px solid transparent;
}

.banner.info {
  background: var(--color-info-soft);
  color: var(--color-info);
}

.banner.warning {
  background: var(--color-warning-soft);
  color: var(--color-warning);
}

.banner.danger {
  background: var(--color-danger-soft);
  color: var(--color-danger);
}

.banner.success {
  background: var(--color-success-soft);
  color: var(--color-success);
}

.live-region {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 8px;
  z-index: 20;
}

.brand-mark {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--color-primary);
  color: white;
  font-weight: 900;
  letter-spacing: 0.02em;
  margin-bottom: 16px;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.nav-btn {
  border: 0;
  background: transparent;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 62px;
  padding: 6px;
  cursor: pointer;
  font-size: 11px;
  width: 100%;
}

.nav-btn .icon {
  font-size: 21px;
  line-height: 1;
}

.nav-btn:hover {
  background: var(--color-surface-2);
  color: var(--color-text);
}

.nav-btn.active {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 700;
}

.nav-btn .nav-badge {
  font-size: 10px;
  font-weight: 800;
}

.sidebar-bottom {
  margin-top: auto;
  width: 100%;
  display: grid;
  gap: 8px;
}

.app-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  min-height: 64px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 18px;
  position: sticky;
  top: 0;
  z-index: 15;
}

.topbar-left,
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.app-title {
  font-weight: 800;
  white-space: nowrap;
}

.context-pill,
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--color-border);
  border-radius: 999px;
  padding: 6px 9px;
  font-size: 12px;
  font-weight: 650;
  background: var(--color-surface);
  white-space: nowrap;
}

.status-pill.success {
  color: var(--color-success);
  background: var(--color-success-soft);
  border-color: transparent;
}

.status-pill.warning {
  color: var(--color-warning);
  background: var(--color-warning-soft);
  border-color: transparent;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex: 0 0 auto;
}

.content {
  padding: 18px;
  min-height: 0;
  flex: 1;
}

/* Tablet / compact desktop: keep rail + split, hide secondary cashier pill. */
@media (max-width: 1050px) {
  :root {
    --sidebar: 76px;
  }

  .topbar .context-pill.secondary {
    display: none;
  }
}

/* Phone: bottom navigation, not a squeezed desktop rail. */
@media (max-width: 820px) {
  :root {
    --sidebar: 0px;
  }

  .app-shell {
    display: block;
    padding-bottom: 68px;
  }

  .sidebar {
    position: fixed;
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 68px;
    border-right: 0;
    border-top: 1px solid var(--color-border);
    padding: 5px 8px;
    flex-direction: row;
    z-index: 50;
  }

  .brand-mark,
  .sidebar-bottom {
    display: none;
  }

  .nav-list {
    flex-direction: row;
    justify-content: space-around;
    gap: 2px;
    height: 100%;
  }

  .nav-btn {
    flex: 1;
    min-height: 56px;
    padding: 3px;
  }

  .nav-btn .icon {
    font-size: 18px;
  }

  .topbar {
    min-height: 58px;
    padding: 7px 12px;
  }

  .topbar .app-title,
  .topbar .context-pill {
    display: none;
  }

  .content {
    padding: 12px;
  }
}

@media (max-width: 480px) {
  .topbar-right .status-pill .status-text {
    display: none;
  }

  .page-head {
    display: grid;
  }
}

.workspace-surface { min-width: 0; }
.workspace-banner { margin-bottom: var(--space-3); flex-wrap: wrap; align-items: center; }
.workspace-state { display: flex; min-height: 140px; align-items: center; justify-content: center; gap: var(--space-3); text-align: center; }
.workspace-state p { margin: 6px 0 0; color: var(--color-text-muted); }
.workspace-spinner { width: 24px; height: 24px; border: 3px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: workspace-spin .8s linear infinite; }
.workspace-subline { display: block; margin-top: 3px; color: var(--color-text-muted); font-size: var(--font-sm); }
.workspace-badge { display: inline-flex; width: fit-content; align-items: center; border-radius: 999px; padding: 4px 8px; background: var(--color-surface-2); color: var(--color-text-muted); font-size: var(--font-xs); font-weight: 800; text-transform: capitalize; }
.workspace-badge.success { background: var(--color-success-soft); color: var(--color-success); }
.workspace-badge.warning { background: var(--color-warning-soft); color: var(--color-warning); }
.workspace-badge.danger { background: var(--color-danger-soft); color: var(--color-danger); }
.workspace-badge.info { background: var(--color-info-soft); color: var(--color-info); }

.technical-details {
  margin-top: 10px;
  font-size: var(--font-sm);
  color: var(--color-text-muted);
}

.technical-details summary {
  cursor: pointer;
  font-weight: 700;
}

.technical-details dl {
  margin: 8px 0 0;
  display: grid;
  gap: 4px;
}

.technical-details dl > div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.technical-details dt {
  font-weight: 600;
}

.technical-details dd {
  margin: 0;
  text-align: right;
  overflow-wrap: anywhere;
}

@keyframes workspace-spin { to { transform: rotate(360deg); } }

.operational-surface { min-width: 0; }
.operational-banner { margin-bottom: var(--space-3); flex-wrap: wrap; align-items: center; }
.operational-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-3); }
.operational-metric { display: grid; gap: 5px; padding: var(--space-4); min-height: 100px; align-content: center; }
.operational-metric strong { font-size: 25px; }
.operational-metric .operational-build { font-size: var(--font-md); overflow-wrap: anywhere; }
.operational-state { display: flex; min-height: 120px; align-items: center; justify-content: center; gap: var(--space-3); text-align: center; }
.operational-state p { margin: 6px 0 0; color: var(--color-text-muted); }
.operational-spinner { width: 24px; height: 24px; border: 3px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: operational-spin .8s linear infinite; flex: 0 0 auto; }
.operational-health-list { display: grid; gap: var(--space-2); }
.operational-health-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); border: 1px solid var(--color-border); border-radius: 10px; padding: 11px 12px; background: var(--color-surface); }
.operational-health-row > div { display: grid; gap: 4px; min-width: 0; }
.operational-health-row span:not(.workspace-badge), .operational-health-row small { color: var(--color-text-muted); font-size: var(--font-sm); }
.operational-version { margin-top: var(--space-3); }
.operational-version h2, .operational-panel h2 { margin: 0 0 var(--space-3); font-size: var(--font-lg); }
.operational-version-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
.operational-version-grid > div { display: grid; gap: 3px; }
.operational-version-grid dt { color: var(--color-text-muted); font-size: var(--font-xs); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.operational-version-grid dd { margin: 0; font-weight: 800; font-size: var(--font-md); }
.operational-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); align-items: center; }
.operational-attention-list { display: grid; gap: var(--space-3); }
.operational-attention-item { display: grid; gap: var(--space-3); padding: var(--space-4); border-left: 4px solid var(--color-warning); }
.operational-attention-item.severity-critical { border-left-color: var(--color-danger); }
.operational-attention-item.severity-medium { border-left-color: var(--color-warning); }
.operational-attention-item.severity-low { border-left-color: var(--color-info); }
.operational-attention-item p { margin: 0; }
.operational-attention-head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
.operational-attention-head > div { display: grid; gap: 4px; }
.operational-attention-head > div > span { color: var(--color-text-muted); font-size: var(--font-sm); }
.operational-dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(13,20,32,.48); }
.operational-dialog { width: min(620px, 100%); max-height: min(88vh, 850px); overflow: auto; border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-surface); box-shadow: var(--shadow-md); }
.operational-dialog-head { padding: var(--space-4) 18px; border-bottom: 1px solid var(--color-border); }
.operational-dialog-head h2 { margin: 3px 0 0; }
.operational-dialog-body { padding: 18px; }
.operational-dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-4) 18px; border-top: 1px solid var(--color-border); }
.operational-detail-list { display: grid; gap: var(--space-2); margin: 0; }
.operational-detail-list > div { display: flex; justify-content: space-between; gap: var(--space-3); border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-2); }
.operational-detail-list dt { color: var(--color-text-muted); }
.operational-detail-list dd { margin: 0; font-weight: 800; text-align: right; }
.operational-panel { display: grid; gap: var(--space-3); }
.operational-panel > p { margin: 0; color: var(--color-text-muted); }
.operational-recovery-steps { margin: 0; padding-left: 22px; display: grid; gap: 7px; }
.operational-danger-button { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 35%, var(--color-border)); }

@keyframes operational-spin { to { transform: rotate(360deg); } }

@media (max-width: 820px) {
  .operational-metrics, .operational-version-grid { grid-template-columns: 1fr; }
  .operational-health-row, .operational-attention-head { align-items: flex-start; flex-direction: column; }
  .operational-dialog-backdrop { place-items: end center; padding: 0; }
  .operational-dialog { width: 100%; max-height: 92vh; border-radius: 18px 18px 0 0; border-left: 0; border-right: 0; border-bottom: 0; }
  .operational-dialog-actions .btn { flex: 1 1 150px; }
}

.register-open,
.register-close {
  max-width: 420px;
}

.register-open .btn.primary {
  width: 100%;
}

.register-screen {
  display: grid;
  gap: 16px;
}

@media (max-width: 820px) {
  .register-open,
  .register-close {
    max-width: none;
  }
}

.orders-workspace .workspace-badge { margin-top: 6px; }
.orders-workspace .workspace-badge.success { text-transform: lowercase; }
.workspace-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 230px); gap: var(--space-3); align-items: end; margin-bottom: var(--space-3); }
.workspace-table-wrap { overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
.workspace-table { width: 100%; min-width: 760px; border-collapse: collapse; }
.workspace-table th, .workspace-table td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--color-border); vertical-align: top; }
.workspace-table th { position: sticky; top: 0; background: var(--color-surface-2); color: var(--color-text-muted); font-size: var(--font-xs); text-transform: uppercase; letter-spacing: .05em; z-index: 1; }
.workspace-table tr:last-child td { border-bottom: 0; }
.workspace-link { border: 0; min-height: 0; padding: 0; background: transparent; color: var(--color-primary); font: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

@media (max-width: 820px) {
  .workspace-toolbar { grid-template-columns: 1fr; }
  .workspace-table-wrap { border: 0; background: transparent; overflow: visible; }
  .workspace-table, .workspace-table tbody, .workspace-table tr, .workspace-table td { display: block; width: 100%; }
  .workspace-table { min-width: 0; }
  .workspace-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
  .workspace-table tbody { display: grid; gap: var(--space-3); }
  .workspace-table tr { border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-sm); padding: var(--space-3); }
