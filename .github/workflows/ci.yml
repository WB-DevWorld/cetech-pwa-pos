name: CI
on:
  push:
    branches: [main, 'ws1/**', 'ws2/**', 'ws3/**', 'fix/**', 'batch/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Verify foundation and contracts
        run: python3 scripts/verify_control_plane.py
      - name: Tooling regressions
        run: python3 -m unittest discover -s tests/tooling -v
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, pinned 2026-09-12
        with:
          version: 12.4.1
      - name: Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned 2026-09-12
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase database
        id: supabase-start
        run: npx --yes supabase@2.117.0 db start
      - name: Reset local database
        run: npx --yes supabase@2.117.0 db reset --yes --local
      - name: Run pgTAP
        run: npx --yes supabase@2.117.0 test db
      - name: Stop local Supabase
        if: ${{ always() && steps.supabase-start.outcome == 'success' }}
        run: npx --yes supabase@2.117.0 stop --no-backup
      - name: App lint
        run: pnpm --dir apps/pos-web lint
      - name: App typecheck
        run: pnpm --dir apps/pos-web typecheck
      - name: App unit tests
        run: pnpm --dir apps/pos-web test
      - name: App production build
        run: pnpm --dir apps/pos-web build
      - name: Install Playwright Chromium
        working-directory: apps/pos-web
        run: pnpm exec playwright install --with-deps chromium
      - name: App E2E smoke
        run: pnpm --dir apps/pos-web test:e2e
  control-plane-windows:
    name: control-plane-windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Exercise Windows checkout conversion
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-09-12
        with:
          python-version: '3.10'
      - name: Verify foundation and contracts
        run: python scripts/verify_control_plane.py
      - name: Tooling regressions
        run: python -m unittest discover -s tests/tooling -v
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, pinned 2026-09-12
        with:
          version: 12.4.1
      - name: Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned 2026-09-12
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: App lint
        run: pnpm --dir apps/pos-web lint
      - name: App typecheck
        run: pnpm --dir apps/pos-web typecheck
      - name: App unit tests
        run: pnpm --dir apps/pos-web test
      - name: App production build
        run: pnpm --dir apps/pos-web build
