name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Verify foundation and contracts
        run: python3 scripts/verify_control_plane.py
      - name: Tooling regressions
        run: python3 -m unittest discover -s tests/tooling -v
  control-plane-windows:
    name: control-plane-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Exercise Windows checkout conversion
        run: git config --global core.autocrlf true
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-09-12
        with:
          python-version: '3.10'
      - name: Verify foundation and contracts
        run: python scripts/verify_control_plane.py
      - name: Tooling regressions
        run: python -m unittest discover -s tests/tooling -v
# CP-05/BR-01/CORE-01 add real lockfile install, lint/typecheck/unit/build,
# PHP/contract/RLS and Playwright checks when scaffolds exist. No fake skipped gates.
