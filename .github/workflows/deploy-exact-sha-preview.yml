name: Exact SHA Preview

# Trusted deployment authority is this file on protected main.
# Dispatch only from main. Candidate application code is never checked out
# and is never built in GitHub Actions. Vercel builds the verified Git SHA
# remotely in the Preview environment, where Preview environment variables
# may be available to that build/runtime. Exact-head independent approval
# from an authorized repository reviewer who is not the PR author is required
# before any Vercel deployment request. Repository policy is one independent
# review, matching protected-main required_approving_review_count. This is
# not production promotion, not merge authorization, and must not move the
# shared staging alias.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to deploy as an immutable Vercel Preview
        required: true
        type: string
      pr_number:
        description: Open same-repository PR whose current head must equal candidate_sha
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: exact-sha-preview-${{ github.event.inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  deploy-exact-sha-preview:
    name: deploy-exact-sha-preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}

    steps:
      - name: Refuse non-main dispatch and production promotion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Exact SHA Preview may only run from protected main." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Exact SHA Preview refuses production promotion refs." >&2
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" != "WB-DevWorld/cetech-pwa-pos" ]]; then
            echo "Exact SHA Preview refuses to run outside WB-DevWorld/cetech-pwa-pos." >&2
            exit 1
          fi

      - name: Checkout trusted main workflow revision only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Confirm candidate source was not checked out
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "Trusted checkout ${actual} does not equal dispatch SHA ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "$actual" == "$CANDIDATE_SHA" && "$GITHUB_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "Candidate SHA was checked out into the Actions runner." >&2
            exit 1
          fi

      - name: Verify GitHub PR, exact-head reviews and GitHub Actions CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/exact_sha_preview.py verify

      - name: Create remote Git-source Preview
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python3 scripts/exact_sha_preview.py deploy

      - name: Smoke immutable Preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=vercel@59.17.0 -- vercel curl "/" \
            --deployment "${{ steps.deploy.outputs.url }}" \
            --fail \
            --show-error \
            > /dev/null
