name: Exact SHA Preview

# Trusted deployment authority is this file on protected main.
# Dispatch only from main. Candidate application code is checked out by SHA
# after repository, PR, and required-CI verification. This is not production
# promotion and must not move the shared staging alias.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to deploy as an immutable Vercel Preview
        required: true
        type: string
      pr_number:
        description: Optional open same-repository PR whose current head must equal candidate_sha
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: exact-sha-preview-${{ github.event.inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  deploy-exact-sha-preview:
    name: deploy-exact-sha-preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Refuse non-main dispatch and production promotion
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Exact SHA Preview may only run from protected main." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Exact SHA Preview refuses production promotion refs." >&2
            exit 1
          fi

      - name: Verify candidate SHA, repository, PR and required CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          sha = os.environ.get("CANDIDATE_SHA", "").strip().lower()
          pr_number = os.environ.get("PR_NUMBER", "").strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          token = os.environ["GH_TOKEN"]
          required = ("control-plane", "control-plane-windows")

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              raise SystemExit(1)

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              fail("candidate_sha must be a full 40-character hex SHA.")

          def gh(path: str, accept: str = "application/vnd.github+json"):
              request = urllib.request.Request(
                  f"{api}/repos/{repo}{path}",
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "cetech-exact-sha-preview",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response), response.headers
              except urllib.error.HTTPError as error:
                  fail(f"GitHub API {path} failed with HTTP {error.code}.")

          commit, _ = gh(f"/commits/{sha}")
          if commit.get("sha", "").lower() != sha:
              fail("candidate_sha is not a commit in this repository.")

          pulls, _ = gh(f"/commits/{sha}/pulls")
          same_repo_pulls = [
              pull for pull in pulls
              if (pull.get("head") or {}).get("repo")
              and pull["head"]["repo"].get("full_name") == repo
              and (pull.get("base") or {}).get("repo")
              and pull["base"]["repo"].get("full_name") == repo
          ]
          if pulls and not same_repo_pulls:
              fail("candidate_sha is only associated with fork pull requests.")

          if pr_number:
              if not re.fullmatch(r"[1-9][0-9]*", pr_number):
                  fail("pr_number must be a positive integer when supplied.")
              pull, _ = gh(f"/pulls/{pr_number}")
              if pull.get("state") != "open":
                  fail(f"PR #{pr_number} must be open.")
              head_repo = ((pull.get("head") or {}).get("repo") or {}).get("full_name")
              base_repo = ((pull.get("base") or {}).get("repo") or {}).get("full_name")
              if head_repo != repo or base_repo != repo:
                  fail(f"PR #{pr_number} must belong to this repository (no forks).")
              head_sha = (pull.get("head") or {}).get("sha", "").lower()
              if head_sha != sha:
                  fail(
                      f"PR #{pr_number} current head {head_sha} does not equal candidate_sha {sha}."
                  )

          checks, _ = gh(f"/commits/{sha}/check-runs?per_page=100")
          runs = checks.get("check_runs") or []
          latest = {}
          for run in runs:
              name = run.get("name")
              if name not in required:
                  continue
              status = run.get("status")
              if status in {"queued", "in_progress", "waiting", "pending", "requested"}:
                  fail(f"Required check {name} is still {status} on {sha}.")
              completed_at = run.get("completed_at") or ""
              previous = latest.get(name)
              if previous is None or completed_at >= previous["completed_at"]:
                  latest[name] = {
                      "conclusion": run.get("conclusion"),
                      "completed_at": completed_at,
                      "html_url": run.get("html_url"),
                  }

          missing = [name for name in required if name not in latest]
          if missing:
              fail("Missing required CI checks for candidate SHA: " + ", ".join(missing))
          failed = [
              f"{name}={info['conclusion']}"
              for name, info in latest.items()
              if info["conclusion"] != "success"
          ]
          if failed:
              fail("Required CI checks have not succeeded: " + ", ".join(failed))

          github_env = os.environ.get("GITHUB_ENV")
          if not github_env:
              fail("GITHUB_ENV is unavailable.")
          with open(github_env, "a", encoding="utf-8") as handle:
              handle.write(f"CANDIDATE_SHA={sha}\n")

          print(f"Verified in-repository SHA {sha}")
          if pr_number:
              print(f"Verified open same-repository PR #{pr_number} head match")
          for name, info in latest.items():
              print(f"Required check {name}: success")
          PY

      - name: Check preview deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            {
              echo "### CETECH POS exact SHA Preview"
              echo
              echo "**BLOCKED_CONFIGURATION**"
              echo
              echo "Required staging deployment configuration is missing:"
              printf -- '- `%s`\n' "${missing[@]}"
              echo
              echo "No Preview, staging-alias, or production change was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Confirm checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$CANDIDATE_SHA" ]]; then
            echo "Checked-out HEAD ${actual} does not equal candidate ${CANDIDATE_SHA}" >&2
            exit 1
          fi

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, pinned 2026-09-12
        with:
          version: 12.4.1

      - name: Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned 2026-09-12
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm exec --yes --package=vercel@59.17.0 -- vercel pull
          --yes
          --environment=preview
          --token="$VERCEL_TOKEN"

      - name: Verify Vercel monorepo root contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          project_root="$(node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));process.stdout.write(p.settings?.rootDirectory ?? p.projectSettings?.rootDirectory ?? '')")"
          if [[ "$project_root" != "apps/pos-web" ]]; then
            echo "Unexpected Vercel rootDirectory: '${project_root:-<empty>}'" >&2
            exit 1
          fi

      - name: Build Vercel artifact
        env:
          BUILD_ID: ${{ env.CANDIDATE_SHA }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npm exec --yes --package=vercel@59.17.0 -- vercel build
          --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${VERCEL_STAGING_ALIAS:-}" ]]; then
            echo "Exact SHA Preview refuses to consume VERCEL_STAGING_ALIAS." >&2
            exit 1
          fi
          deployment_url="$(npm exec --yes --package=vercel@59.17.0 -- vercel deploy --prebuilt --yes --env BUILD_ID="$CANDIDATE_SHA" --token="$VERCEL_TOKEN" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Unexpected Vercel deployment output." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke immutable Preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package=vercel@59.17.0 -- vercel curl "/" \
            --deployment "${{ steps.deploy.outputs.url }}" \
            --fail \
            --show-error \
            > /dev/null

      - name: Record immutable Preview result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### CETECH POS exact SHA Preview"
            echo
            echo "**DEPLOYED_PREVIEW**"
            echo
            echo "- Candidate SHA: \`${CANDIDATE_SHA}\`"
            if [[ -n "${PR_NUMBER}" ]]; then
              echo "- Verified open PR: #\`${PR_NUMBER}\`"
            else
              echo "- Verified open PR: not supplied"
            fi
            echo "- Vercel Preview: ${{ steps.deploy.outputs.url }}"
            echo "- Shared staging alias: not moved"
            echo "- Production promotion: refused"
            echo
            echo "This is an immutable Vercel Preview only. It does not authorize production promotion, shared-staging alias movement, electronic-payment execution, refund/restock effects, or VitePOS cutover."
          } >> "$GITHUB_STEP_SUMMARY"
