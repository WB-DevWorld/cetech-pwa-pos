name: Staging CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cetech-pos-shared-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: deploy-staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      CI_TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_STAGING_ALIAS: ${{ vars.VERCEL_STAGING_ALIAS }}

    steps:
      - name: Check staging deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_STAGING_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            {
              echo "### CETECH POS shared staging"
              echo
              echo "**BLOCKED_CONFIGURATION**"
              echo
              echo "The CI-green main revision was not deployed because required staging configuration is missing:"
              printf -- '- `%s`\n' "${missing[@]}"
              echo
              echo "No production promotion or business-system write was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout exact CI-tested main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, pinned 2026-09-12
        with:
          version: 12.4.1

      - name: Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, pinned 2026-09-12
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Preview environment
        working-directory: apps/pos-web
        run: >-
          pnpm dlx vercel@59.17.0 pull
          --yes
          --environment=preview
          --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        working-directory: apps/pos-web
        run: >-
          pnpm dlx vercel@59.17.0 build
          --build-env BUILD_ID="$CI_TESTED_SHA"
          --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt artifact
        id: deploy
        working-directory: apps/pos-web
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(pnpm dlx vercel@59.17.0 deploy --prebuilt --yes --env BUILD_ID="$CI_TESTED_SHA" --token="$VERCEL_TOKEN" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Unexpected Vercel deployment output: $deployment_url" >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Move stable staging alias
        working-directory: apps/pos-web
        run: >-
          pnpm dlx vercel@59.17.0 alias set
          "${{ steps.deploy.outputs.url }}"
          "$VERCEL_STAGING_ALIAS"
          --token="$VERCEL_TOKEN"

      - name: Smoke shared staging origin
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://${VERCEL_STAGING_ALIAS}/" \
            > /dev/null

      - name: Record deployment result
        shell: bash
        run: |
          {
            echo "### CETECH POS shared staging"
            echo
            echo "**DEPLOYED_STAGING**"
            echo
            echo "- CI-tested SHA: `${CI_TESTED_SHA}`"
            echo "- Vercel deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Stable staging origin: https://${VERCEL_STAGING_ALIAS}"
            echo "- Source CI run: ${{ github.event.workflow_run.html_url }}"
            echo
            echo "This is a staging deployment only. It does not authorize production promotion, electronic-payment execution, refund/restock effects, or VitePOS cutover."
          } >> "$GITHUB_STEP_SUMMARY"
